name: Sync

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), at :17 to avoid the top-of-hour rush
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: sync
        options:
          - sync      # full sync: CourseWorks, course websites, and email summaries → Notion
          - dry-run   # read everything, write nothing, log what would change
          - preview   # CourseWorks only: list courses and upcoming work (no Notion needed)
          - inspect   # CourseWorks only: where assignment instructions and files live
          - check     # can CourseWorks, Notion, Ed and Claude be reached with the saved keys?
          - ed-inspect  # Ed only: list courses and a few threads (read-only)

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  courseworks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          CANVAS_TOKEN: ${{ secrets.COURSEWORKTOK }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ED_TOKEN: ${{ secrets.ED_TOKEN }}
          EMAIL_MODEL: ${{ vars.EMAIL_MODEL }}
          CONVERT_MODEL: ${{ vars.CONVERT_MODEL }}
          MODE: ${{ inputs.mode || 'sync' }}
        run: |
          if [ -z "$CANVAS_TOKEN" ] || [ -z "$NOTION_TOKEN" ]; then
            echo "::notice::Add the COURSEWORKTOK and NOTION_TOKEN secrets to start syncing (README → Setup)."
            exit 0
          fi
          case "$MODE" in
            preview) python -m scheduleaid preview ;;
            inspect) python -m scheduleaid inspect ;;
            check)   python -m scheduleaid check ;;
            ed-inspect) python -m scheduleaid inspect --ed ;;
            dry-run) python -m scheduleaid sync --dry-run ;;
            *)       python -m scheduleaid sync ;;
          esac
